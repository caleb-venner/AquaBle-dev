[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aquable"
version = "4.0.3"
description = "Home Assistant integration for controlling Chihiros aquarium devices over Bluetooth Low Energy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.21.0",
    "bleak-retry-connector>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "homeassistant>=2024.1.0",
]

[project.urls]
"Source Code" = "https://github.com/caleb-venner/AquaBle"
"Bug Reports" = "https://github.com/caleb-venner/AquaBle/issues"
"Home Assistant" = "https://www.home-assistant.io/"

[tool.setuptools]
platforms = ["any"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []
