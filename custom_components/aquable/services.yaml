doser_set_daily_dose_sequence:
  name: Set doser daily schedule
  description: Configure complete schedule for a single doser head
  fields:
    device_id:
      name: Device
      description: Target doser device
      required: true
      selector:
        device:
          integration: aquable
          entity:
            domain: sensor
    head_index:
      name: Head index
      description: Head number (1-4)
      required: true
      selector:
        number:
          min: 1
          max: 4
          mode: box
    volume_ml:
      name: Volume (mL)
      description: Daily dose volume in milliliters
      required: true
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: mL
          mode: box
    hour:
      name: Hour
      description: Schedule hour (0-23)
      required: true
      selector:
        number:
          min: 0
          max: 23
          mode: box
    minute:
      name: Minute
      description: Schedule minute (0-59)
      required: true
      selector:
        number:
          min: 0
          max: 59
          mode: box
    weekdays:
      name: Active weekdays
      description: Days of week when dosing is active
      required: false
      selector:
        select:
          options:
            - label: Monday
              value: monday
            - label: Tuesday
              value: tuesday
            - label: Wednesday
              value: wednesday
            - label: Thursday
              value: thursday
            - label: Friday
              value: friday
            - label: Saturday
              value: saturday
            - label: Sunday
              value: sunday
          multiple: true

doser_manual_dose:
  name: Manual Dose
